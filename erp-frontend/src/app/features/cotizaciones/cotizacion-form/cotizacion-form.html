<mat-card class="tarjeta">
  <mat-card-header>
    <mat-card-title>Nueva cotizacion</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="formulario" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline" class="campo">
        <mat-label>Cliente</mat-label>
        <mat-select formControlName="idCliente">
          @for (cliente of clientes(); track cliente.idCliente) {
            <mat-option [value]="cliente.idCliente">{{ cliente.nombre }}</mat-option>
          }
        </mat-select>
        @if (formulario.controls.idCliente.hasError('required')) {
          <mat-error>El cliente es obligatorio</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="campo">
        <mat-label>Fecha estimada del evento</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="fechaEvento" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="campo">
        <mat-label>Presupuesto del cliente (Q)</mat-label>
        <input matInput type="number" formControlName="presupuestoCliente" min="0" />
      </mat-form-field>

      <div class="acciones">
        <button mat-button type="button" routerLink="/cotizaciones">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="guardando()">Guardar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
