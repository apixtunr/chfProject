<div class="encabezado">
  <h1>Cotizaciones</h1>
  @if (puedeCrear) {
    <button mat-flat-button color="primary" routerLink="/cotizaciones/nueva">
      <mat-icon>add</mat-icon>
      Nueva cotización
    </button>
  }
</div>

<table mat-table [dataSource]="cotizaciones()" class="tabla">
  <ng-container matColumnDef="cliente">
    <th mat-header-cell *matHeaderCellDef>Cliente</th>
    <td mat-cell *matCellDef="let c">{{ c.clienteNombre }}</td>
  </ng-container>

  <ng-container matColumnDef="fechaCotizacion">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let c">{{ c.fechaCotizacion | date: 'dd/MM/yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let c">
      @if (c.ultimaVersionEstado) {
        <mat-chip [color]="colorEstado(c.ultimaVersionEstado)" highlighted>
          v{{ c.ultimaVersionNumero }} · {{ c.ultimaVersionEstado }}
        </mat-chip>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="monto">
    <th mat-header-cell *matHeaderCellDef>Monto</th>
    <td mat-cell *matCellDef="let c">Q{{ c.ultimaVersionMonto ?? 0 | number: '1.2-2' }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let c">
  <button mat-icon-button 
          [routerLink]="['/cotizaciones', c.idCotizacion]" 
          matTooltip="Ver cotización" 
          aria-label="Ver">
    <mat-icon>visibility</mat-icon> 
  </button>

    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>

<mat-paginator
  [length]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
>
</mat-paginator>
