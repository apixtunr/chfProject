<div class="encabezado">
  <h1>Clientes</h1>
  @if (puedeCrear) {
    <button mat-flat-button color="primary" routerLink="/clientes/nuevo">
      <mat-icon>add</mat-icon>
      Nuevo cliente
    </button>
  }
</div>

<mat-form-field appearance="outline" class="buscador">
  <mat-label>Buscar por nombre</mat-label>
  <input matInput [(ngModel)]="filtroNombre" (keyup.enter)="buscar()" />
  <button matSuffix mat-icon-button (click)="buscar()">
    <mat-icon>search</mat-icon>
  </button>
</mat-form-field>

<table mat-table [dataSource]="clientes()" class="tabla">
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let cliente">{{ cliente.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="correo">
    <th mat-header-cell *matHeaderCellDef>Correo</th>
    <td mat-cell *matCellDef="let cliente">{{ cliente.correo }}</td>
  </ng-container>

  <ng-container matColumnDef="telefono">
    <th mat-header-cell *matHeaderCellDef>Telefono</th>
    <td mat-cell *matCellDef="let cliente">{{ cliente.telefono }}</td>
  </ng-container>

  <ng-container matColumnDef="nit">
    <th mat-header-cell *matHeaderCellDef>NIT</th>
    <td mat-cell *matCellDef="let cliente">{{ cliente.nit }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let cliente">
      @if (puedeEditar) {
        <button mat-icon-button [routerLink]="['/clientes', cliente.idCliente, 'editar']" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
      }
      @if (puedeEliminar) {
        <button mat-icon-button (click)="eliminar(cliente)" aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>

<mat-paginator
  [length]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
>
</mat-paginator>
