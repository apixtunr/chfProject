<div class="encabezado">
  <h1>Platos</h1>
  @if (puedeCrear) {
    <button mat-flat-button color="primary" routerLink="/menus/platos/nuevo">
      <mat-icon>add</mat-icon>
      Nuevo plato
    </button>
  }
</div>

<mat-form-field appearance="outline" class="buscador">
  <mat-label>Buscar por nombre</mat-label>
  <input matInput [(ngModel)]="filtroNombre" (keyup.enter)="buscar()" />
  <button matSuffix mat-icon-button (click)="buscar()" aria-label="Buscar">
    <mat-icon>search</mat-icon>
  </button>
</mat-form-field>

<table mat-table [dataSource]="platos()" class="tabla">
  <ng-container matColumnDef="nombrePlato">
    <th mat-header-cell *matHeaderCellDef>Plato</th>
    <td mat-cell *matCellDef="let p">{{ p.nombrePlato }}</td>
  </ng-container>

  <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let p">{{ p.estadoNombre }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let p">
      @if (puedeEditar) {
        <button mat-icon-button [routerLink]="['/menus/platos', p.idPlato, 'editar']" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
      }
      @if (puedeEliminar) {
        <button mat-icon-button (click)="eliminar(p)" aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>

<mat-paginator
  [length]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
>
</mat-paginator>
