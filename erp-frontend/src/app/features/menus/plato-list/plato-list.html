<div class="encabezado">
  <h1>Platos</h1>
  <div class="encabezado-acciones">
    <div class="buscador">
      <mat-icon class="buscador-icono">search</mat-icon>
      <input class="buscador-input" type="text" [(ngModel)]="filtroNombre" (ngModelChange)="buscarAlEscribir()" (keyup.enter)="buscar()" placeholder="Buscar por nombre..." aria-label="Buscar por nombre" />
    </div>
    @if (puedeCrear) {
      <button mat-flat-button class="list-btn-nuevo" routerLink="/menus/platos/nuevo">
        <mat-icon>add</mat-icon>
        Nuevo plato
      </button>
    }
  </div>
</div>

<div class="tabla-contenedor">
<table mat-table [dataSource]="platos()" class="tabla">
  <ng-container matColumnDef="nombrePlato">
    <th mat-header-cell *matHeaderCellDef>Plato</th>
    <td mat-cell *matCellDef="let p">{{ p.nombrePlato }}</td>
  </ng-container>

  <ng-container matColumnDef="unidadVenta">
    <th mat-header-cell *matHeaderCellDef>Precio</th>
    <td mat-cell *matCellDef="let p">{{ precioPor(p.unidadVenta) }}</td>
  </ng-container>

  <ng-container matColumnDef="bebidas">
    <th mat-header-cell *matHeaderCellDef>Bebida incluida</th>
    <td mat-cell *matCellDef="let p">{{ p.bebidas.length ? nombresBebidas(p.bebidas) : '-' }}</td>
  </ng-container>

  <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let p">{{ p.estadoNombre }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let p">
      @if (puedeEditar) {
        <button mat-icon-button class="tbl-btn-editar" [routerLink]="['/menus/platos', p.idPlato, 'editar']" matTooltip="Editar" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
      }
      @if (puedeEliminar) {
        <button mat-icon-button class="tbl-btn-eliminar" (click)="eliminar(p)" matTooltip="Eliminar" aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>

<mat-paginator
  [length]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
>
</mat-paginator>
</div>
