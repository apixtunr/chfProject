<div class="encabezado">
  <h1>Bebidas</h1>
  @if (puedeCrear) {
    <button mat-flat-button color="primary" routerLink="/menus/bebidas/nueva">
      <mat-icon>add</mat-icon>
      Nueva bebida
    </button>
  }
</div>

<mat-form-field appearance="outline" class="buscador">
  <mat-label>Buscar por nombre</mat-label>
  <input matInput [(ngModel)]="filtroNombre" (ngModelChange)="buscarAlEscribir()" (keyup.enter)="buscar()" />
  <button matSuffix mat-icon-button (click)="buscar()" matTooltip="Buscar" aria-label="Buscar">
    <mat-icon>search</mat-icon>
  </button>
</mat-form-field>

<div class="tabla-contenedor">
<table mat-table [dataSource]="bebidas()" class="tabla">
  <ng-container matColumnDef="nombreBebida">
    <th mat-header-cell *matHeaderCellDef>Bebida</th>
    <td mat-cell *matCellDef="let b">{{ b.nombreBebida }}</td>
  </ng-container>

  <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let b">{{ b.estadoNombre }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let b">
      @if (puedeEditar) {
        <button mat-icon-button class="tbl-btn-editar" [routerLink]="['/menus/bebidas', b.idBebida, 'editar']" matTooltip="Editar" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
      }
      @if (puedeEliminar) {
        <button mat-icon-button class="tbl-btn-eliminar" (click)="eliminar(b)" matTooltip="Eliminar" aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>

<mat-paginator
  [length]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
>
</mat-paginator>
</div>
