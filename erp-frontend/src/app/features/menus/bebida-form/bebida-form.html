<mat-card class="tarjeta">
  <mat-card-header>
    <mat-card-title>{{ idBebida() ? 'Editar bebida' : 'Nueva bebida' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="formulario" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline" class="campo">
        <mat-label>Nombre de la bebida</mat-label>
        <input matInput formControlName="nombreBebida" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="campo">
        <mat-label>Estado</mat-label>
        <mat-select formControlName="idEstado">
          @for (estado of estados(); track estado.idEstado) {
            <mat-option [value]="estado.idEstado">{{ estado.nombre }}</mat-option>
          }
        </mat-select>
        <mat-hint>Una bebida inactiva deja de ofrecerse al cotizar; lo ya cotizado no cambia.</mat-hint>
      </mat-form-field>

      <div class="acciones">
        <button mat-button type="button" routerLink="/menus/bebidas">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="guardando()">Guardar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
