<div class="encabezado">
  <h1>Vehiculos</h1>
  @if (puedeCrear) {
    <button mat-flat-button routerLink="/vehiculos/nuevo">
      <mat-icon>add</mat-icon>
      Nuevo vehiculo
    </button>
  }
</div>

<table mat-table [dataSource]="vehiculos()" class="tabla">
  <ng-container matColumnDef="placa">
    <th mat-header-cell *matHeaderCellDef>Placa</th>
    <td mat-cell *matCellDef="let v">{{ v.placa }}</td>
  </ng-container>

  <ng-container matColumnDef="marca">
    <th mat-header-cell *matHeaderCellDef>Marca</th>
    <td mat-cell *matCellDef="let v">{{ v.nombreMarca }}</td>
  </ng-container>

  <ng-container matColumnDef="linea">
    <th mat-header-cell *matHeaderCellDef>Linea</th>
    <td mat-cell *matCellDef="let v">{{ v.nombreLinea }}</td>
  </ng-container>

  <ng-container matColumnDef="tipoPlaca">
    <th mat-header-cell *matHeaderCellDef>Tipo de placa</th>
    <td mat-cell *matCellDef="let v">{{ v.tipoPlacaNombre }}</td>
  </ng-container>

  <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let v">{{ v.estadoNombre }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let v">
      @if (puedeEditar) {
        <button mat-icon-button [routerLink]="['/vehiculos', v.idVehiculo, 'editar']" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
      }
      @if (puedeEliminar) {
        <button mat-icon-button (click)="eliminar(v)" aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>

<mat-paginator
  [length]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
>
</mat-paginator>
