<div class="login-fondo">
  <div class="login-card">
    <div class="login-icono">
      <mat-icon>restaurant</mat-icon>
    </div>
    <h1>La Casa del Chef</h1>
    <p class="subtitulo">Gestion profesional de banquetes</p>

    <form [formGroup]="formulario" (ngSubmit)="ingresar()">
      <label class="etiqueta" for="username">Usuario</label>
      <div class="campo-icono">
        <mat-icon>person</mat-icon>
        <input
          id="username"
          formControlName="username"
          autocomplete="username"
          placeholder="Ingrese su usuario"
        />
      </div>

      <label class="etiqueta" for="password">Contrasena</label>
      <div class="campo-icono">
        <mat-icon>lock</mat-icon>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Ingrese su contraseña"
        />
      </div>

      @if (errorMensaje()) {
        <p class="error">{{ errorMensaje() }}</p>
      }

      <button type="submit" class="boton-ingresar" [disabled]="cargando()">
        @if (cargando()) {
          <mat-spinner diameter="20" color="accent"></mat-spinner>
        } @else {
          <span>Ingresar</span>
          <mat-icon>arrow_forward</mat-icon>
        }
      </button>
    </form>
  </div>

  <p class="pie">© 2026 La Casa del Chef</p>
</div>
