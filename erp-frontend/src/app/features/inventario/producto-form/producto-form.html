<mat-card class="tarjeta">
  <mat-card-header>
    <mat-card-title>{{ idProducto() ? 'Editar producto' : 'Nuevo producto' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="formulario" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline" class="campo">
        <mat-label>Nombre del producto</mat-label>
        <input matInput formControlName="nombreProducto" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="campo">
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="idCategoria">
          @for (categoria of categorias(); track categoria.idCategoria) {
            <mat-option [value]="categoria.idCategoria">
              {{ categoria.nombreTipo }} - {{ categoria.nombreCategoria }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="campo">
        <mat-label>Unidad de medida</mat-label>
        <input matInput formControlName="unidadMedida" placeholder="unidad, libra, litro..." />
      </mat-form-field>

      <mat-form-field appearance="outline" class="campo">
        <mat-label>Precio unitario (Q)</mat-label>
        <input matInput type="number" min="0" step="0.01" formControlName="precioUnitario" />
      </mat-form-field>

      <div class="acciones">
        <button mat-button type="button" routerLink="/inventario/productos">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="guardando()">Guardar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
