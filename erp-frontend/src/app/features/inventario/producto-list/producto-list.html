<div class="encabezado">
  <h1>Productos</h1>
  @if (puedeCrear) {
    <button mat-flat-button color="primary" routerLink="/inventario/productos/nuevo">
      <mat-icon>add</mat-icon>
      Nuevo producto
    </button>
  }
</div>

<mat-form-field appearance="outline" class="buscador">
  <mat-label>Buscar por nombre</mat-label>
  <input matInput [(ngModel)]="filtroNombre" (keyup.enter)="buscar()" />
  <button matSuffix mat-icon-button (click)="buscar()" matTooltip="Buscar" aria-label="Buscar">
    <mat-icon>search</mat-icon>
  </button>
</mat-form-field>

<table mat-table [dataSource]="productos()" class="tabla">
  <ng-container matColumnDef="nombreProducto">
    <th mat-header-cell *matHeaderCellDef>Producto</th>
    <td mat-cell *matCellDef="let p">{{ p.nombreProducto }}</td>
  </ng-container>

  <ng-container matColumnDef="categoria">
    <th mat-header-cell *matHeaderCellDef>Categoria</th>
    <td mat-cell *matCellDef="let p">{{ p.nombreCategoria }}</td>
  </ng-container>

  <ng-container matColumnDef="unidadMedida">
    <th mat-header-cell *matHeaderCellDef>Unidad</th>
    <td mat-cell *matCellDef="let p">{{ p.unidadMedida }}</td>
  </ng-container>

  <ng-container matColumnDef="precioUnitario">
    <th mat-header-cell *matHeaderCellDef>Precio unitario</th>
    <td mat-cell *matCellDef="let p">Q {{ p.precioUnitario }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let p">
      @if (puedeEditar) {
        <button mat-icon-button [routerLink]="['/inventario/productos', p.idProducto, 'editar']" matTooltip="Editar producto" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
      }
      @if (puedeEliminar) {
        <button mat-icon-button (click)="eliminar(p)" matTooltip="Eliminar producto" aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>

<mat-paginator
  [length]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
>
</mat-paginator>
