<div class="encabezado">
  <h1>Gestión de eventos</h1>
  @if (puedeCrear) {
    <button mat-flat-button color="primary" routerLink="/eventos/nuevo">
      <mat-icon>add</mat-icon>
      Nuevo evento
    </button>
  }
</div>

<div class="tabla-contenedor">
  <table mat-table [dataSource]="eventos()" class="tabla">
    <ng-container matColumnDef="cliente">
      <th mat-header-cell *matHeaderCellDef>Cliente</th>
      <td mat-cell *matCellDef="let e">{{ e.clienteNombre }}</td>
    </ng-container>

    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let e">{{ e.tipoEventoNombre }}</td>
    </ng-container>

    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let e">{{ e.fechaEvento | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="horario">
      <th mat-header-cell *matHeaderCellDef>Horario</th>
      <td mat-cell *matCellDef="let e">{{ e.horaInicio?.slice(0, 5) }} a {{ e.horaFin?.slice(0, 5) }} hrs.</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let e">
        <mat-chip
          highlighted
          [style.--mat-chip-elevated-container-color]="colorEstado(e.estadoNombre).bg"
          [style.--mat-chip-label-text-color]="colorEstado(e.estadoNombre).text"
          [style.--mat-chip-outline-color]="colorEstado(e.estadoNombre).text"
        >{{ e.estadoNombre }}</mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let e">
        <button mat-icon-button [routerLink]="['/eventos', e.idEvento]" matTooltip="Ver evento" aria-label="Ver">
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>

  <mat-paginator
    [length]="totalElements()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPageChange($event)"
  >
  </mat-paginator>
</div>
