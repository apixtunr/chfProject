server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprime lo que vale la pena: el bundle inicial son ~790 kB de JS que
    # bajan a ~170 kB comprimidos.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API va al backend por la red interna de Docker. Al compartir origen con
    # el frontend, el navegador no hace peticiones cross-origin y CORS no entra
    # en juego.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El PDF de cotizaciones puede tardar: margen sobre el default de 60s.
        proxy_read_timeout 120s;

        # Comprobantes de pago de hasta 5 MB (el default de nginx es 1 MB). Igual que
        # spring.servlet.multipart.max-request-size en el backend.
        client_max_body_size 6m;
    }

    # Los archivos con hash en el nombre (chunk-ABC123.js) nunca cambian de
    # contenido: se cachean para siempre.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular resuelve el enrutado en el navegador: el servidor no conoce rutas
    # como /eventos/5, asi que cualquier ruta devuelve index.html y el router se
    # encarga. Sin esto, recargar la pagina en una ruta interna da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: es el que apunta a los bundles con hash nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
