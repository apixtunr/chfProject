
services:
  db:
    image: postgres:18
    restart: unless-stopped
    command: postgres -c timezone=America/Guatemala
    environment:
      TZ: America/Guatemala
      POSTGRES_DB: ${POSTGRES_DB:-lacasadelchef}
      POSTGRES_USER: ${POSTGRES_USER:-chfadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chfadmin} -d ${POSTGRES_DB:-lacasadelchef}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./erp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Guatemala
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-lacasadelchef}
      DB_USERNAME: ${POSTGRES_USER:-chfadmin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${HTTP_PORT:-8090}}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70}

  web:
    build: ./erp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8090}:80"

volumes:
  db-data:
