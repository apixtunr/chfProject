# ===========================================================================
# Perfil de produccion. Se activa con --spring.profiles.active=prod
#
# Solo contiene lo que debe cambiar respecto del perfil de desarrollo; el resto
# se hereda de application.properties.
# ===========================================================================

# La documentacion de la API queda apagada: publicarla sin sesion equivale a
# entregar el mapa de rutas a probar. Para desarrollar sigue disponible.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Sin el volcado de sentencias SQL: llena el log y puede dejar datos a la vista.
logging.level.org.hibernate.SQL=warn
spring.jpa.properties.hibernate.format_sql=false

# Sin la red local de desarrollo: solo los origenes que se indiquen al desplegar.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}


# Detras de un proxy inverso (Caddy -> nginx -> backend) la aplicacion recibe la
# peticion por http aunque el usuario la haya hecho por https. Con esto Spring
# reconstruye el esquema y el host originales a partir de las cabeceras
# X-Forwarded-*, lo que endereza las URLs que genera y la deteccion de mismo
# origen.
server.forward-headers-strategy=framework
