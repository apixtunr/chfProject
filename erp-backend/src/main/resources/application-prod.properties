# ===========================================================================
# Perfil de produccion. Se activa con --spring.profiles.active=prod
#
# Solo contiene lo que debe cambiar respecto del perfil de desarrollo; el resto
# se hereda de application.properties.
# ===========================================================================

# La documentacion de la API queda apagada: publicarla sin sesion equivale a
# entregar el mapa de rutas a probar. Para desarrollar sigue disponible.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Sin el volcado de sentencias SQL: llena el log y puede dejar datos a la vista.
logging.level.org.hibernate.SQL=warn
spring.jpa.properties.hibernate.format_sql=false
