spring.application.name=erp-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/lacasadelchef
spring.datasource.username=chfadmin
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.security.jwt.expiration-minutes=480
app.security.max-intentos-acceso=5
app.cors.allowed-origins=http://localhost:4200

logging.level.org.hibernate.SQL=debug
