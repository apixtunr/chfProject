spring.application.name=erp-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lacasadelchef}
spring.datasource.username=${DB_USERNAME:chfadmin}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.security.jwt.secret=${JWT_SECRET:cambiar-este-secreto-por-uno-de-al-menos-64-caracteres}
app.security.jwt.expiration-minutes=480
app.security.max-intentos-acceso=5
app.cors.allowed-origins=http://localhost:4200,http://192.168.*.*:4200

app.cotizacion.vigencia-dias=15

logging.level.org.hibernate.SQL=debug

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
