spring.application.name=erp-backend

# La base se elige con variables de entorno (DB_URL, DB_USERNAME, DB_PASSWORD): asi la PC
# y la laptop apuntan a la misma base en la nube sin guardar contrasenas en el codigo.
# Sin variables, se usa la base local de siempre.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lacasadelchef}
spring.datasource.username=${DB_USERNAME:chfadmin}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate: la base de datos (migraciones Flyway) es la fuente de verdad.
# Hibernate solo valida que las entidades coincidan; nunca la modifica.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway: migraciones versionadas en src/main/resources/db/migration ---
# baseline-on-migrate: al conectar con una base que YA tiene el esquema (creado
# a mano antes de adoptar Flyway) registra una linea base en vez de fallar.
# baseline-version=1: marca V1 (esquema inicial) como ya aplicada en esa base;
# solo ejecuta V2 en adelante. En una base vacia ejecuta todo desde V1.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Comprobantes de pago: foto de la boleta o PDF de la transferencia, hasta 5 MB.
# La peticion trae ademas los datos del comprobante, de ahi el margen en la total.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# En produccion definir via variable de entorno JWT_SECRET (min. 64 chars)
app.security.jwt.secret=${JWT_SECRET:cambiar-este-secreto-por-uno-de-al-menos-64-caracteres}
app.security.jwt.expiration-minutes=480
app.security.max-intentos-acceso=5
# Ademas de localhost, la red local: para probar desde un celular en el mismo WiFi
# (npm run start:red). Produccion lo reemplaza, ver application-prod.properties.
app.cors.allowed-origins=http://localhost:4200,http://192.168.*.*:4200

# Dias que una cotizacion enviada respeta sus precios (se imprime en el PDF).
app.cotizacion.vigencia-dias=15

logging.level.org.hibernate.SQL=debug

# --- Documentacion de la API (Swagger) ---
# Publica el mapa completo de endpoints sin pedir sesion, lo que es comodo para
# desarrollar y para la sustentacion, pero en un servidor real le regala a cualquiera
# la lista de rutas a probar. Se deja encendida aqui y se apaga en application-prod,
# que es el perfil con el que deberia levantarse en produccion:
#     java -jar erp-backend.jar --spring.profiles.active=prod
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
